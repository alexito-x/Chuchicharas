name: Analisis y APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Node y Java
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extraer paquetes del proyecto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          shopt -s nullglob
          archives=(Chuchicharas-Parte-*.zip)
          if [ "${#archives[@]}" -ne 4 ]; then
            echo "Se esperaban 4 paquetes ZIP y se encontraron ${#archives[@]}."
            exit 1
          fi
          for archive in "${archives[@]}"; do unzip -oq "$archive" -d work; done
          test -f work/Chuchicharas/frontend/package.json
          test -f work/Chuchicharas/backend/package.json
          echo "Proyecto extraído correctamente."

      - name: Validar sintaxis de scripts antes de preparar el proyecto
        run: node --check .github/scripts/prepare-frontend.mjs

      - name: Aplicar catálogo local y diseño responsivo
        run: node .github/scripts/prepare-frontend.mjs

      - name: Instalar y probar backend
        working-directory: work/Chuchicharas/backend
        run: |
          npm ci
          npm test

      - name: Instalar dependencias y compilar frontend
        working-directory: work/Chuchicharas/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          node --input-type=module -e "import fs from 'node:fs'; const p='vite.config.js'; let s=fs.readFileSync(p,'utf8'); if (!/base:/.test(s)) s=s.replace('export default defineConfig({', \"export default defineConfig({\\n  base: './',\"); fs.writeFileSync(p,s);"
          npm run build
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::VITE_API_URL no está configurada. El catálogo público funcionará con los 141 productos locales; cuentas, pedidos y administración requieren desplegar el backend HTTPS."
          fi
          npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.chuchicharas.app",
            "appName": "Chuchicharas",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="work/Chuchicharas/frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: chuchicharas-android-debug
          path: work/Chuchicharas/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar informe de análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analisis-estructura-chuchicharas
          path: work/Chuchicharas/
          if-no-files-found: warn
          retention-days: 30
